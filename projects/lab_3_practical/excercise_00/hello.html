<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h1>Bài tập đầu tiên với JS</h1>
    <p>Mở Console với F12 để xem kết quả</p>
    <script>
        let ten = "66B Nguyễn Sỹ Sách";
        let tuoi = 20;
        let laSinhVien = true;
        let diachi = 'Nam Định';
        let loichao = `Xin chào ${ten}`;

        console.log( ten);
        console.log( diachi);
        console.log(loichao);

        let songuyen = 42;
        let sothuc = 3.14;
        let am = -10;
        let voCuc = Infinity;

        console.log(typeof songuyen);

        let laTrue = true;
        let laFalse = false;

        console.log(typeof laTrue);

        let giatriNULL = null;
        let chuaGanGiaTri;

        console.log(typeof giatriNULL);
        console.log(typeof chuaGanGiaTri);

        console.log("42 là: ", typeof 42);
        console.log("'42' là: ", typeof "42");
        console.log("true là: ", typeof true);
    </script>
</body>
