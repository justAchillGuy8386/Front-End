<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>User Directory</h1>
            <input type="text" id="searchInput" placeholder="Search by name or email...">
            <button id="openAddModalBtn" class="btn btn-primary">Add New User</button>
        </header>

        <!-- Toast Notifications -->
        <div id="toastContainer" class="toast-container"></div>

        <main>
            <div id="loadingSkeleton" class="skeleton-container hidden">
                <!-- Skeletons will be injected here -->
            </div>
            
            <div class="table-responsive">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userList">
                        <!-- User rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="userModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Add User</h2>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="userName" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="userEmail" required>
                </div>
                <div class="form-group">
                    <label>Phone:</label>
                    <input type="text" id="userPhone" required>
                </div>
                <div class="form-actions">
                    <button type="button" id="closeModalBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" id="saveUserBtn" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Dialog for Delete -->
    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <h2>Confirm Delete</h2>
            <p>Are you sure you want to delete <span id="deleteUserName"></span>?</p>
            <div class="form-actions">
                <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
                <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
